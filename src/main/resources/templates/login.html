<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | HANDONG CLUBBOX</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="auth-page">
    <section class="panel auth-card">
        <div class="eyebrow">HANDONG CLUBBOX</div>
        <h1 id="auth-title">로그인</h1>
        <p>모든 사용자는 동일한 화면에서 로그인합니다.<br>공연 관리 권한은 등록된 계정에만 자동으로 부여됩니다.</p>
        <form id="login-form">
            <div class="field"><label for="username">이름</label><input class="input" id="username" value="명수호"
                                                                      maxlength="20" autocomplete="name" required></div>
            <div class="field"><label for="student-id">학번</label><input class="input" id="student-id" value="22300253"
                                                                        maxlength="12" inputmode="numeric"
                                                                        autocomplete="username" required></div>
            <button class="btn btn-primary btn-block" id="login-submit" type="submit">로그인</button>
        </form>
        <p class="text-note" style="margin:14px 0 0">※ 프론트엔드 시연용 로그인입니다. 테스트 학번: 22300253(노트동아리 관리자), 22300272(일반 회원).
            관리 권한을 직접 선택할 수 없으며, 실제 인증은 추후 서버에서 구현합니다.</p></section>
</main>
<script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
