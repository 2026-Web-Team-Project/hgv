<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | HANDONG CLUBBOX</title>
    <link rel="stylesheet" href="../static/assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="auth-page">
    <section class="panel auth-card">
        <div class="eyebrow">HANDONG CLUBBOX</div>
        <h1 id="auth-title">데모 로그인</h1>
        <p>프론트엔드 동작 확인을 위한 데모 계정입니다.</p>
        <div class="field"><label for="username">이름</label><input class="input" id="username" value="명수호" maxlength="20"
                                                                  autocomplete="name"></div>
        <div class="field"><label for="student-id">학번</label><input class="input" id="student-id" value="22300253"
                                                                    maxlength="12" inputmode="numeric"></div>
        <span class="label">데모 역할 선택</span>
        <div class="demo-login" role="group" aria-label="데모 역할">
            <button class="active" type="button" data-role="USER">일반 사용자</button>
            <button type="button" data-role="ADMIN">노트동아리 관리자</button>
        </div>
        <button class="btn btn-primary btn-block" id="login-submit">데모 계정으로 시작하기</button>
        <p class="text-note" style="margin:14px 0 0">※ 실제 인증 기능이 아니며, 관리자 선택은 UI 테스트용입니다. 인증·권한 검사는 추후 서버에서 구현해야
            합니다.</p></section>
</main>
<script type="module" src="../static/assets/js/pages/login.js"></script>
</body>
</html>
